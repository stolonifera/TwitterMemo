<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ひとこと</title>
  <meta name="description" content="SNS 風のひとりメモ">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ひとこと">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    // 画面のちらつきを防ぐため、見た目の設定だけ先に反映
    try {
      var p = JSON.parse(localStorage.getItem('hitokoto-look') || '{}');
      var h = document.documentElement;
      if (p.theme) h.dataset.theme = p.theme;
      if (p.accent) h.dataset.accent = p.accent;
      if (p.font) h.dataset.font = p.font;
      h.dataset.avatar = p.avatar || 'square';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button class="icon-btn" id="topLeft" aria-label="メニュー"></button>
        <h1 id="title">ホーム</h1>
        <button class="icon-btn sync-btn" id="syncBtn" aria-label="同期状態"></button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <button class="fab" id="fab" aria-label="投稿する">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="tabbar" id="tabbar">
      <a href="#/home" data-tab="home" aria-label="ホーム">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>ホーム</span>
      </a>
      <a href="#/search" data-tab="search" aria-label="検索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>検索</span>
      </a>
      <a href="#/likes" data-tab="likes" aria-label="いいね">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.6C1.4 8.6 3 5 6.5 5c2 0 3.3 1.1 4.1 2.3L12 9l1.4-1.7C14.2 6.1 15.5 5 17.5 5 21 5 22.6 8.6 21.2 11.4 19 15.6 12 20 12 20z"/></svg>
        <span>いいね</span>
      </a>
      <a href="#/settings" data-tab="settings" aria-label="設定">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>設定</span>
      </a>
    </nav>
  </div>

  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
